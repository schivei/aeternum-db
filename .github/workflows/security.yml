name: Security Scanning

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [ '*' ]
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # ── SAST: GitHub CodeQL ─────────────────────────────────────────────────────
  codeql:
    name: "🔬 CodeQL (SAST)"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET SDK 10.x
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-codeql-${{ hashFiles('**/*.csproj') }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality

      - name: Restore dependencies
        working-directory: ./src
        run: dotnet restore AeternumDB.slnx

      - name: Build for CodeQL
        working-directory: ./src
        run: dotnet build AeternumDB.slnx --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

  # ── SAST: Semgrep ────────────────────────────────────────────────────────────
  semgrep:
    name: "🔍 Semgrep (SAST)"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semgrep (C# + security rules)
        run: |
          semgrep \
            --config "p/csharp" \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --sarif \
            --output semgrep.sarif \
            . || true

      - name: Upload Semgrep SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ── Dependency CVE Scan: dotnet list package ─────────────────────────────────
  dotnet-audit:
    name: "🛡️ NuGet Audit (CVE Scan)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET SDK 10.x
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        working-directory: ./src
        run: dotnet restore AeternumDB.slnx

      - name: Audit NuGet packages for vulnerabilities
        working-directory: ./src
        run: |
          dotnet list AeternumDB.slnx package --vulnerable --include-transitive 2>&1 | tee /tmp/audit.txt
          if grep -q "has the following vulnerable packages" /tmp/audit.txt; then
            echo "❌ Vulnerable NuGet packages found:"
            cat /tmp/audit.txt
            exit 1
          else
            echo "✅ No vulnerable NuGet packages found."
          fi

  # ── Secret Scanning: Gitleaks ────────────────────────────────────────────────
  gitleaks:
    name: "🔑 Secret Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── SAST: Grype filesystem scan ──────────────────────────────────────────────
  grype-fs:
    name: "🔭 Grype FS Scan (SAST)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Grype vulnerability scanner (filesystem)
        uses: anchore/scan-action@v7.4.0
        id: grype-fs
        with:
          path: .
          output-format: sarif
          output-file: grype-fs.sarif
          severity-cutoff: medium
          fail-build: "false"
          cache-db: true

      - name: Upload Grype FS SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype-fs.sarif
          category: grype-filesystem

  # ── Security Report Summary ──────────────────────────────────────────────────
  security-report:
    name: "📋 Security Report"
    runs-on: ubuntu-latest
    needs: [codeql, semgrep, dotnet-audit, gitleaks, grype-fs]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Write job summary
        run: |
          status() {
            if [ "$1" = "success" ]; then echo "✅ Pass"; elif [ "$1" = "skipped" ]; then echo "⏭️ Skipped"; else echo "❌ Fail"; fi
          }

          {
            echo "## 🔒 Security Scan Results"
            echo ""
            echo "| Tool | Category | Status |"
            echo "|------|----------|--------|"
            echo "| [CodeQL](../../security/code-scanning) | SAST | $(status '${{ needs.codeql.result }}') |"
            echo "| [Semgrep](../../security/code-scanning) | SAST | $(status '${{ needs.semgrep.result }}') |"
            echo "| [Grype FS](../../security/code-scanning) | SAST | $(status '${{ needs.grype-fs.result }}') |"
            echo "| NuGet Audit | CVE Dependency Scan | $(status '${{ needs.dotnet-audit.result }}') |"
            echo "| Gitleaks | Secret Detection | $(status '${{ needs.gitleaks.result }}') |"
            echo ""
            echo "> 🔗 Full SARIF findings are in the [Security tab](../../security/code-scanning)."
            echo "> 📅 This workflow also runs weekly to catch newly-published advisories."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with security results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const results = {
              codeql:      '${{ needs.codeql.result }}',
              semgrep:     '${{ needs.semgrep.result }}',
              grypefs:     '${{ needs.grype-fs.result }}',
              dotnetAudit: '${{ needs.dotnet-audit.result }}',
              gitleaks:    '${{ needs.gitleaks.result }}',
            };

            const icon = (r) =>
              r === 'success' ? '✅ Pass' : r === 'skipped' ? '⏭️ Skipped' : '❌ Fail';

            const allPassed = Object.values(results).every(
              (r) => r === 'success' || r === 'skipped'
            );
            const overallIcon = allPassed ? '✅' : '❌';
            const overallText = allPassed
              ? 'All security checks passed.'
              : '⚠️ One or more security checks failed. Please review the details below.';

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const securityUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/security/code-scanning`;

            const body = [
              `## ${overallIcon} Security Scan Results`,
              '',
              overallText,
              '',
              '| Tool | Category | Status |',
              '|------|----------|--------|',
              `| [CodeQL](${securityUrl}) | SAST | ${icon(results.codeql)} |`,
              `| [Semgrep](${securityUrl}) | SAST | ${icon(results.semgrep)} |`,
              `| [Grype FS](${securityUrl}) | SAST | ${icon(results.grypefs)} |`,
              `| NuGet Audit | CVE Dependency Scan | ${icon(results.dotnetAudit)} |`,
              `| Gitleaks | Secret Detection | ${icon(results.gitleaks)} |`,
              '',
              `> 🔗 Full SARIF findings are in the [Security tab](${securityUrl}).`,
              `> 📋 [View full workflow run](${runUrl})`,
              '',
              '<!-- aeternumdb-security-scan-report -->',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('<!-- aeternumdb-security-scan-report -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
